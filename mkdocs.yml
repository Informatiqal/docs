# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json?raw=true

site_name: Informatiqal
repo_url: https://github.com/Informatiqal
repo_name: I N F O R M A T I Q A L
theme:
  name: material
  features:
    - navigation.path
    - navigation.top
    - search.highlight
    - navigation.indexes
    # - navigation.tracking
    # - navigation.instant
    # - navigation.instant.prefetch
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for automatic mode
    - media: "slate"
      scheme: slate
      toggle:
        icon: material/brightness-7
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: default)"
      scheme: default
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
site_url: https://informatiqal.com/
site_description: Informatiqal detailed user documentation
extra:
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/informatiqal
      name: Informatiqal on X (Twitter)
    - icon: fontawesome/brands/discord
      link: https://discord.gg/KhQ3vZWZWx
      name: Informatiqal on Discord
    - icon: fontawesome/brands/github
      link: https://github.com/Informatiqal
      name: Informatiqal on GitHub
extra_css:
  - stylesheets/extra.css
plugins:
  - rss:
      abstract_chars_count: 160
      comments_path: "null"
      enabled: true
      feed_ttl: 1440
      image: https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Feed-icon.svg/128px-Feed-icon.svg.png
      length: 20
      match_path: .*
      pretty_print: false
  - search:
      lang: en
  # - offline:
  #     enabled: true
  # - section-index
markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: zensical.extensions.emoji.twemoji
      emoji_generator: zensical.extensions.emoji.to_svg

