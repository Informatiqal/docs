          - qlBuilder/plugins.md
          - "Community plugins": qlBuilder/plugins/community.md
          - "Developing plugin": qlBuilder/plugins/developing.md
  - "Automatiqal":
      - automatiqal/index.md
      - "JS Package":
          - automatiqal/package/index.md
          - "Runbook structure": "automatiqal/package/runbook-structure.md"
          - "Tasks": "automatiqal/package/tasks.md"
          - "Events": "automatiqal/package/events.md"
          - "Operations": "automatiqal/package/operations.md"
          - "Authentication": "automatiqal/package/authentication.md"
      - "CLI":
